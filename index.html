<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alafia Wellness Clinic - Physiotherapy & Nutrition | Kampala</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#1A56DB',
                            navy: '#0D2E6E',
                            blue: '#1A56DB',
                            teal: '#2EAA4A',
                            lightBg: '#F0F7F1'
                        }
                    },
                    fontFamily: {
                        sans: ['Heebo', 'sans-serif'],
                        heading: ['Poppins', 'sans-serif'],
                    },
                    fontSize: {
                        'h1': '48px',
                        'h2': '38px',
                        'body': '18px',
                    },
                    borderRadius: {
                        'brand': '10px',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Heebo', sans-serif;
            color: #4A5568;
            background-color: #FFFFFF;
        }
        h1, h2, h3, h4, h5, h6, .font-heading {
            font-family: 'Poppins', sans-serif;
        }
        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
        }
        .marquee-content {
            display: inline-block;
            animation: marquee 20s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .dot-pattern {
            background-image: radial-gradient(#0D2E6E 10%, transparent 11%);
            background-size: 20px 20px;
        }
        .bg-wave-teal {
            background: linear-gradient(135deg, #2EAA4A 0%, #1A56DB 100%);
        }
        /* Curve mask for the bottom of sections if needed */
        .curve-bottom {
            border-bottom-left-radius: 50% 5%;
            border-bottom-right-radius: 50% 5%;
        }
        .hero-bg-overlay {
            background: linear-gradient(90deg, rgba(255,255,255,1) 0%, rgba(255,255,255,0.85) 45%, rgba(255,255,255,0) 100%);
        }
    </style>
</head>
<body class="antialiased">

    <!-- Marquee Banner -->
   <P style="text-align:centre;">COMING SOON</P> 

</body>
</html>
